[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elte-daily-digest"
version = "0.1.0"
description = "Daily email TL;DR digest for new ELTE news and events."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.31,<3",
]

[project.scripts]
elte-digest = "elte_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
